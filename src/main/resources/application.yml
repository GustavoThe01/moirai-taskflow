spring:
  application:
    name: moirai-taskflow
  datasource:
    url: jdbc:sqlite:moirai.db?foreign_keys=on
    hikari:
      maximum-pool-size: 1 # o SQLite aceita um único escritor por vez
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate # quem cria o schema é o Flyway; o Hibernate só confere

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json
  # Os erros são documentados por endpoint (components/responses), e não copiados do @RestControllerAdvice para todos.
  override-with-generic-response: false

info:
  app:
    name: Moirai Taskflow
    version: "@project.version@"
    description: As Moiras tecem, medem e cortam o fio de cada tarefa.
